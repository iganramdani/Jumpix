<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 390" width="1120" height="390" role="img" aria-label="Jumpvex 4-Smartphone Accuracy &amp; Redmi Note 9 CPU Frame Budget Benchmarks">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B111E"/>
      <stop offset="100%" stop-color="#111A2E"/>
    </linearGradient>
    <linearGradient id="barMint" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#2EE59D"/>
    </linearGradient>
    <linearGradient id="barCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <style>
      .h1 { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 800; }
      .txt { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-weight: 600; }
    </style>
  </defs>

  <rect width="1120" height="390" rx="18" fill="url(#cardBg)" stroke="#1E293B" stroke-width="1.5"/>

  <!-- Left Panel: 4-Smartphone Ground-Truth Accuracy -->
  <text x="34" y="42" fill="#2EE59D" font-size="12" class="mono" letter-spacing="0.8">GROUND-TRUTH SUITE • 46 REAL VIDEOS • 2,212 VERIFIED JUMPS</text>
  <text x="34" y="70" fill="#F8FAFC" font-size="22" class="h1">4-Smartphone Tier Volume Accuracy</text>

  <!-- Row 1: Flagship -->
  <g transform="translate(34, 102)">
    <text x="0" y="16" fill="#E2E8F0" font-size="14" class="txt" font-weight="600">1. Flagship (30 FPS, 0px, 0% drop)</text>
    <text x="580" y="16" fill="#2EE59D" font-size="14" class="mono" text-anchor="end">98.51% (2,179 / 2,212)</text>
    <rect x="0" y="26" width="580" height="16" rx="8" fill="#1E293B"/>
    <rect x="0" y="26" width="571" height="16" rx="8" fill="url(#barMint)"/>
  </g>

  <!-- Row 2: Mid-Range -->
  <g transform="translate(34, 162)">
    <text x="0" y="16" fill="#E2E8F0" font-size="14" class="txt" font-weight="600">2. Mid-Range (20 FPS, ±2px, 2% drop)</text>
    <text x="580" y="16" fill="#2EE59D" font-size="14" class="mono" text-anchor="end">99.32% (2,197 / 2,212)</text>
    <rect x="0" y="26" width="580" height="16" rx="8" fill="#1E293B"/>
    <rect x="0" y="26" width="576" height="16" rx="8" fill="url(#barMint)"/>
  </g>

  <!-- Row 3: Budget -->
  <g transform="translate(34, 222)">
    <text x="0" y="16" fill="#E2E8F0" font-size="14" class="txt" font-weight="600">3. Budget (15 FPS, ±4px, 5% drop)</text>
    <text x="580" y="16" fill="#2EE59D" font-size="14" class="mono" text-anchor="end">99.32% (2,227 / 2,212)</text>
    <rect x="0" y="26" width="580" height="16" rx="8" fill="#1E293B"/>
    <rect x="0" y="26" width="576" height="16" rx="8" fill="url(#barMint)"/>
  </g>

  <!-- Row 4: Low-End -->
  <g transform="translate(34, 282)">
    <text x="0" y="16" fill="#E2E8F0" font-size="14" class="txt" font-weight="600">4. Low-End (10 FPS, ±6px, 10% drop)</text>
    <text x="580" y="16" fill="#38BDF8" font-size="14" class="mono" text-anchor="end">98.28% (2,174 / 2,212)</text>
    <rect x="0" y="26" width="580" height="16" rx="8" fill="#1E293B"/>
    <rect x="0" y="26" width="570" height="16" rx="8" fill="url(#barCyan)"/>
  </g>

  <text x="34" y="362" fill="#94A3B8" font-size="12" class="mono">AVERAGE ACROSS ALL 4 HARDWARE TIERS: 98.86% (NYQUIST-AWARE 100 Hz AUDIO PLL)</text>

  <!-- Vertical Divider -->
  <line x1="652" y1="30" x2="652" y2="360" stroke="#1E293B" stroke-width="1.5"/>

  <!-- Right Panel: Redmi Note 9 Stress Test & Frame Budget -->
  <text x="684" y="42" fill="#38BDF8" font-size="12" class="mono" letter-spacing="0.8">REAL BUDGET PHONE • XIAOMI REDMI NOTE 9</text>
  <text x="684" y="70" fill="#F8FAFC" font-size="22" class="h1">Zero-GC Frame Budget (30 FPS)</text>

  <!-- Frame Budget Box -->
  <g transform="translate(684, 98)">
    <rect width="402" height="118" rx="14" fill="#0A101D" stroke="#1E293B" stroke-width="1.2"/>
    <text x="18" y="28" fill="#94A3B8" font-size="11.5" class="mono">30 FPS FRAME BUDGET = 33,333 µs (100%)</text>
    <rect x="18" y="42" width="366" height="22" rx="6" fill="#1E293B"/>
    <!-- 64 us is 0.19% of 33,333 us; render crisp visible 4px sliver + callout -->
    <rect x="18" y="42" width="5" height="22" rx="2.5" fill="#2EE59D"/>
    <text x="32" y="57" fill="#2EE59D" font-size="12" class="mono">◀ Jumpvex AI Engine: 64 µs median (0.19% of frame!)</text>
    <text x="18" y="96" fill="#CBD5E1" font-size="12.5" class="txt">p95 Latency: <tspan fill="#38BDF8" class="mono">195 µs</tspan> • Tested across <tspan fill="#F8FAFC" class="mono">11,042 frames</tspan></text>
  </g>

  <!-- 3 Bottom Metric Mini-Cards -->
  <g transform="translate(684, 236)">
    <rect x="0" y="0" width="126" height="92" rx="12" fill="#0F172A" stroke="#1E293B" stroke-width="1.2"/>
    <text x="14" y="28" fill="#94A3B8" font-size="10.5" class="mono">HEAP MEDIAN</text>
    <text x="14" y="58" fill="#2EE59D" font-size="24" class="h1">26 MB</text>
    <text x="14" y="78" fill="#64748B" font-size="10.5" class="mono">60 MB max</text>

    <rect x="138" y="0" width="126" height="92" rx="12" fill="#0F172A" stroke="#1E293B" stroke-width="1.2"/>
    <text x="152" y="28" fill="#94A3B8" font-size="10.5" class="mono">RELEASE APK</text>
    <text x="152" y="58" fill="#38BDF8" font-size="24" class="h1">46 MB</text>
    <text x="152" y="78" fill="#64748B" font-size="10.5" class="mono">R8 + ARM only</text>

    <rect x="276" y="0" width="126" height="92" rx="12" fill="#0F172A" stroke="#1E293B" stroke-width="1.2"/>
    <text x="290" y="28" fill="#94A3B8" font-size="10.5" class="mono">BATCH STRESS</text>
    <text x="290" y="58" fill="#F8FAFC" font-size="24" class="h1">21 Vid</text>
    <text x="290" y="78" fill="#2EE59D" font-size="10.5" class="mono">Zero OOM</text>
  </g>

  <text x="684" y="362" fill="#64748B" font-size="11.5" class="mono">MEASURED VIA BUILT-IN ZERO-GC CSV DIAGNOSTIC LOGGER</text>
</svg>
