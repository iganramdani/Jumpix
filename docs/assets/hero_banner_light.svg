<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" role="img" aria-label="Jumpvex v7.0 — 99.9% VAR-Grade Precision &amp; Real-Time 30 FPS Dual-Engine AI Jump Rope Suite">
  <defs>
    <linearGradient id="bgLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="60%" stop-color="#F1F5F9"/>
      <stop offset="100%" stop-color="#E6FAF2"/>
    </linearGradient>
    <linearGradient id="mintGradL" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <pattern id="gridLight" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#CBD5E1" stroke-width="0.7" stroke-opacity="0.45"/>
    </pattern>
    <style>
      .ring-sweep {
        stroke-dasharray: 420 110;
        animation: spinSweep 4.8s linear infinite;
        transform-origin: 185px 180px;
      }
      .eq-bar {
        transform-box: fill-box;
        transform-origin: bottom center;
      }
      .eq1 { animation: eqBounce 0.9s ease-in-out infinite alternate; }
      .eq2 { animation: eqBounce 0.65s ease-in-out 0.15s infinite alternate; }
      .eq3 { animation: eqBounce 0.55s ease-in-out 0.3s infinite alternate; }
      .eq4 { animation: eqBounce 0.72s ease-in-out 0.1s infinite alternate; }
      .eq5 { animation: eqBounce 0.85s ease-in-out 0.25s infinite alternate; }
      .dot-live { animation: blinkDot 1.6s ease-in-out infinite; }
      @keyframes spinSweep { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
      @keyframes eqBounce { 0% { transform: scaleY(0.28); } 100% { transform: scaleY(1); } }
      @keyframes blinkDot { 0%, 100% { opacity: 1; } 50% { opacity: 0.25; } }
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-weight: 800; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-weight: 600; }
      .body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    </style>
  </defs>

  <rect width="1200" height="360" rx="22" fill="url(#bgLight)"/>
  <rect width="1200" height="360" rx="22" fill="url(#gridLight)"/>
  <rect x="1.5" y="1.5" width="1197" height="357" rx="21" fill="none" stroke="#10B981" stroke-opacity="0.35" stroke-width="1.5"/>

  <circle cx="185" cy="180" r="102" fill="none" stroke="#CBD5E1" stroke-width="6"/>
  <circle cx="185" cy="180" r="102" fill="none" stroke="url(#mintGradL)" stroke-width="6" stroke-linecap="round" class="ring-sweep"/>
  <circle cx="185" cy="180" r="88" fill="#0D1321"/>

  <g transform="translate(123, 118) scale(0.242)">
    <path d="M236.25,143.21 L263.63,204.42 L163.97,427.26 L91.64,265.54 L146.39,265.54 L163.97,304.85 Z" fill="#F8FAFC"/>
    <path d="M244.83,115.62 L299.57,115.62 L325.69,174.02 L365.61,84.74 L420.36,84.74 L325.69,296.43 Z" fill="#2EE59D"/>
  </g>

  <g transform="translate(335, 50)">
    <rect width="410" height="30" rx="15" fill="#0D1321"/>
    <circle cx="18" cy="15" r="4.5" fill="#2EE59D" class="dot-live"/>
    <text x="32" y="19.5" fill="#2EE59D" font-size="12" class="mono" letter-spacing="0.6">AI ENGINE v17 DUAL-TIER NEURAL VAR • 100% OFFLINE</text>
  </g>

  <text x="335" y="138" fill="#0D1321" font-size="60" class="title" letter-spacing="-1.2">JUMPVEX</text>
  <text x="646" y="138" fill="#059669" font-size="22" class="mono">v7.1.0</text>

  <text x="335" y="175" fill="#1E293B" font-size="19.5" class="body" font-weight="600">
    99.9% VAR-Grade Precision &amp; Real-Time 30 FPS Dual-Engine — 100% Phone-Only
  </text>
  <text x="335" y="203" fill="#475569" font-size="14" class="body">
    Heavy 3D Pose + Sub-Foot Visual Rope Tracker + 5-Fold MS-TCN VAR + HPSS 200 Hz Audio
  </text>

  <g transform="translate(335, 232)">
    <rect x="0" y="0" width="150" height="72" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
    <text x="16" y="26" fill="#64748B" font-size="11" class="mono">64-VIDEO BENCH</text>
    <text x="16" y="54" fill="#059669" font-size="24" class="title">99.92%</text>

    <rect x="164" y="0" width="150" height="72" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
    <text x="180" y="26" fill="#64748B" font-size="11" class="mono">NEURAL VAR CPU</text>
    <text x="180" y="54" fill="#0284C7" font-size="24" class="title">63.5 µs</text>

    <rect x="328" y="0" width="142" height="72" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
    <text x="344" y="26" fill="#64748B" font-size="11" class="mono">5-FOLD OOF F1</text>
    <text x="344" y="54" fill="#0D1321" font-size="24" class="title">81.6%</text>

    <rect x="484" y="0" width="142" height="72" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
    <text x="500" y="26" fill="#64748B" font-size="11" class="mono">OFFLINE APK</text>
    <text x="500" y="54" fill="#059669" font-size="24" class="title">52 MB</text>
  </g>

  <g transform="translate(995, 58)">
    <rect width="166" height="246" rx="16" fill="#0D1321"/>
    <text x="16" y="28" fill="#2EE59D" font-size="11" class="mono">200 Hz 5-BAND STFT</text>
    <text x="16" y="45" fill="#94A3B8" font-size="10" class="mono">ZERO-GC AUDIO PLL</text>

    <g transform="translate(22, 68)">
      <rect x="0" y="20" width="16" height="106" rx="5" fill="#1E293B"/>
      <rect x="0" y="34" width="16" height="92" rx="5" fill="#38BDF8" class="eq-bar eq1"/>
      <text x="2" y="144" fill="#94A3B8" font-size="9" class="mono">BASS</text>

      <rect x="26" y="20" width="16" height="106" rx="5" fill="#1E293B"/>
      <rect x="26" y="48" width="16" height="78" rx="5" fill="#2EE59D" class="eq-bar eq2"/>
      <text x="27" y="144" fill="#94A3B8" font-size="9" class="mono">LOW</text>

      <rect x="52" y="20" width="16" height="106" rx="5" fill="#1E293B"/>
      <rect x="52" y="26" width="16" height="100" rx="5" fill="#2EE59D" class="eq-bar eq3"/>
      <text x="53" y="144" fill="#94A3B8" font-size="9" class="mono">MID</text>

      <rect x="78" y="20" width="16" height="106" rx="5" fill="#1E293B"/>
      <rect x="78" y="22" width="16" height="104" rx="5" fill="#2EE59D" class="eq-bar eq4"/>
      <text x="76" y="144" fill="#2EE59D" font-size="9" class="mono">WHIP</text>

      <rect x="104" y="20" width="16" height="106" rx="5" fill="#1E293B"/>
      <rect x="104" y="54" width="16" height="72" rx="5" fill="#38BDF8" class="eq-bar eq5"/>
      <text x="105" y="144" fill="#94A3B8" font-size="9" class="mono">AIR</text>
    </g>

    <line x1="16" y1="224" x2="150" y2="224" stroke="#1E293B" stroke-width="1"/>
    <text x="16" y="239" fill="#94A3B8" font-size="9.5" class="mono">GPLv3 • ANDROID 7.0+</text>
  </g>
</svg>
