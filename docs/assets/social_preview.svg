<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" role="img" aria-label="Jumpvex OpenGraph Social Preview">
  <defs>
    <linearGradient id="ogBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070B14"/>
      <stop offset="55%" stop-color="#0D1321"/>
      <stop offset="100%" stop-color="#14233C"/>
    </linearGradient>
    <pattern id="ogGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1E293B" stroke-width="0.8" stroke-opacity="0.5"/>
    </pattern>
    <style>
      .h { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 800; }
      .b { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
      .m { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-weight: 600; }
    </style>
  </defs>
  <rect width="1280" height="640" fill="url(#ogBg)"/>
  <rect width="1280" height="640" fill="url(#ogGrid)"/>
  <rect x="28" y="28" width="1224" height="584" rx="28" fill="none" stroke="#2EE59D" stroke-opacity="0.28" stroke-width="2"/>

  <!-- Left Golden Ratio JV Emblem -->
  <circle cx="240" cy="320" r="142" fill="none" stroke="#1E293B" stroke-width="10"/>
  <circle cx="240" cy="320" r="142" fill="none" stroke="#2EE59D" stroke-width="10" stroke-dasharray="680 220" stroke-linecap="round"/>
  <circle cx="240" cy="320" r="122" fill="#0D1321"/>
  <g transform="translate(154, 234) scale(0.336)">
    <path d="M236.25,143.21 L263.63,204.42 L163.97,427.26 L91.64,265.54 L146.39,265.54 L163.97,304.85 Z" fill="#F8FAFC"/>
    <path d="M244.83,115.62 L299.57,115.62 L325.69,174.02 L365.61,84.74 L420.36,84.74 L325.69,296.43 Z" fill="#2EE59D"/>
  </g>

