  <text x="464" y="135" fill="#2EE59D" font-size="16" class="m">OPEN-SOURCE ANDROID AI • 100% PHONE-ONLY</text>

  <text x="440" y="246" fill="#F8FAFC" font-size="92" class="h" letter-spacing="-2">JUMPVEX</text>
  <text x="440" y="304" fill="#2EE59D" font-size="30" class="h">99% Accuracy &amp; 99% Lightweight</text>
  <text x="440" y="352" fill="#CBD5E1" font-size="22" class="b">Hybrid 2D/3D Vision + 200 Hz Audio STFT IJRC Speed, Trick &amp; Shuffle Engine</text>
  <text x="440" y="388" fill="#94A3B8" font-size="19" class="b">Zero Smartwatch • Synced Slow-Mo Velocity Charts • Camera rPPG HR</text>

