    <rect x="584" y="0" width="175" height="84" rx="14" fill="#111B2E" stroke="#2EE59D" stroke-opacity="0.35"/>
    <text x="602" y="30" fill="#94A3B8" font-size="13" class="m">RELEASE APK</text>
