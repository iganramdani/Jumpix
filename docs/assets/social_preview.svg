    <rect x="198" y="0" width="175" height="84" rx="14" fill="#111B2E" stroke="#38BDF8" stroke-opacity="0.35"/>
    <text x="216" y="30" fill="#94A3B8" font-size="13" class="m">CPU LATENCY</text>
    <text x="216" y="64" fill="#38BDF8" font-size="30" class="h">18.5 µs</text>

    <rect x="391" y="0" width="175" height="84" rx="14" fill="#111B2E" stroke="#1E293B"/>
