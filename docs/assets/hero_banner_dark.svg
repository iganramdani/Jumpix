<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" role="img" aria-label="Jumpvex — 99% Accuracy &amp; 99% Lightweight Phone-Only AI Jump Rope &amp; Shuffle Engine">
  <defs>
    <linearGradient id="bgDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090D16"/>
      <stop offset="55%" stop-color="#0D1321"/>
      <stop offset="100%" stop-color="#131E33"/>
    </linearGradient>
    <linearGradient id="mintGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2EE59D"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <radialGradient id="mintGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2EE59D" stop-opacity="0.28"/>
      <stop offset="60%" stop-color="#2EE59D" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#2EE59D" stop-opacity="0"/>
    </radialGradient>
    <pattern id="gridDark" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#1E293B" stroke-width="0.7" stroke-opacity="0.55"/>
    </pattern>
    <style>
      .ring-sweep {
        stroke-dasharray: 420 110;
        animation: spinSweep 4.8s linear infinite;
        transform-origin: 185px 180px;
      }
      .ring-pulse {
        animation: pulseGlow 2.6s ease-in-out infinite;
        transform-origin: 185px 180px;
      }
      .eq-bar {
        transform-box: fill-box;
        transform-origin: bottom center;
      }
      .eq1 { animation: eqBounce 0.9s ease-in-out infinite alternate; }
      .eq2 { animation: eqBounce 0.65s ease-in-out 0.15s infinite alternate; }
      .eq3 { animation: eqBounce 0.55s ease-in-out 0.3s infinite alternate; }
      .eq4 { animation: eqBounce 0.72s ease-in-out 0.1s infinite alternate; }
      .eq5 { animation: eqBounce 0.85s ease-in-out 0.25s infinite alternate; }
      .dot-live { animation: blinkDot 1.6s ease-in-out infinite; }
      @keyframes spinSweep {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.65; transform: scale(1); }
        50% { opacity: 1; transform: scale(1.03); }
      }
      @keyframes eqBounce {
        0% { transform: scaleY(0.28); }
        100% { transform: scaleY(1); }
      }
      @keyframes blinkDot {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.25; }
      }
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-weight: 800; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-weight: 600; }
      .body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    </style>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="360" rx="22" fill="url(#bgDark)"/>
  <rect width="1200" height="360" rx="22" fill="url(#gridDark)"/>
  <rect x="1.5" y="1.5" width="1197" height="357" rx="21" fill="none" stroke="#2EE59D" stroke-opacity="0.24" stroke-width="1.5"/>

  <!-- Ambient Glow behind Logo -->
  <circle cx="185" cy="180" r="145" fill="url(#mintGlow)" class="ring-pulse"/>

  <!-- Outer Animated Telemetry Ring -->
  <circle cx="185" cy="180" r="102" fill="none" stroke="#1E293B" stroke-width="6"/>
  <circle cx="185" cy="180" r="102" fill="none" stroke="url(#mintGrad)" stroke-width="6" stroke-linecap="round" class="ring-sweep"/>
  <circle cx="185" cy="180" r="88" fill="#0D1321" stroke="#2EE59D" stroke-opacity="0.22" stroke-width="1.5"/>

  <!-- Official Golden Ratio JV Logo (scaled from 512x512 viewBox to 124x124 centered at 185,180) -->
  <g transform="translate(123, 118) scale(0.242)">
    <path d="M236.25,143.21 L263.63,204.42 L163.97,427.26 L91.64,265.54 L146.39,265.54 L163.97,304.85 Z" fill="#F8FAFC"/>
    <path d="M244.83,115.62 L299.57,115.62 L325.69,174.02 L365.61,84.74 L420.36,84.74 L325.69,296.43 Z" fill="#2EE59D"/>
  </g>

  <!-- Live Status Pill -->
  <g transform="translate(335, 50)">
    <rect width="352" height="30" rx="15" fill="#132238" stroke="#2EE59D" stroke-opacity="0.45" stroke-width="1"/>
    <circle cx="18" cy="15" r="4.5" fill="#2EE59D" class="dot-live"/>
    <text x="32" y="19.5" fill="#2EE59D" font-size="12" class="mono" letter-spacing="0.6">AI ENGINE v16 IJRC PRO • 100% PHONE-ONLY</text>
  </g>

  <!-- Main Brand Title & Tagline -->
  <text x="335" y="138" fill="#F8FAFC" font-size="60" class="title" letter-spacing="-1.2">JUMPVEX</text>
  <text x="646" y="138" fill="#2EE59D" font-size="22" class="mono">v6.1.0</text>

  <text x="335" y="175" fill="#CBD5E1" font-size="20" class="body" font-weight="600">
    99% Accuracy &amp; 99% Lightweight — On-Device AI Jump Rope &amp; Shuffle Engine
  </text>
  <text x="335" y="203" fill="#94A3B8" font-size="14.5" class="body">
    Zero Smartwatch • IJRC 200 Hz Speed Engine • Synced Slow-Mo Velocity Charts &amp; Camera rPPG HR
  </text>

  <!-- Live Metric Cards Row -->
  <g transform="translate(335, 232)">
    <rect x="0" y="0" width="150" height="72" rx="12" fill="#111B2E" stroke="#1E293B" stroke-width="1.2"/>
    <text x="16" y="26" fill="#94A3B8" font-size="11" class="mono">64-VIDEO BENCH</text>
    <text x="16" y="54" fill="#2EE59D" font-size="24" class="title">99.42%</text>

    <rect x="164" y="0" width="150" height="72" rx="12" fill="#111B2E" stroke="#1E293B" stroke-width="1.2"/>
    <text x="180" y="26" fill="#94A3B8" font-size="11" class="mono">ENGINE LATENCY</text>
    <text x="180" y="54" fill="#38BDF8" font-size="24" class="title">18.5 µs</text>

    <rect x="328" y="0" width="142" height="72" rx="12" fill="#111B2E" stroke="#1E293B" stroke-width="1.2"/>
    <text x="344" y="26" fill="#94A3B8" font-size="11" class="mono">JVM HEAP RAM</text>
    <text x="344" y="54" fill="#F8FAFC" font-size="24" class="title">26 MB</text>

    <rect x="484" y="0" width="142" height="72" rx="12" fill="#111B2E" stroke="#1E293B" stroke-width="1.2"/>
    <text x="500" y="26" fill="#94A3B8" font-size="11" class="mono">RELEASE APK</text>
    <text x="500" y="54" fill="#2EE59D" font-size="24" class="title">46 MB</text>
  </g>

  <!-- Right Side: Live 5-Band 200 Hz STFT Equalizer Widget -->
  <g transform="translate(995, 58)">
    <rect width="166" height="246" rx="16" fill="#0B1220" stroke="#1E293B" stroke-width="1.3"/>
    <text x="16" y="28" fill="#2EE59D" font-size="11" class="mono">200 Hz 5-BAND STFT</text>
    <text x="16" y="45" fill="#64748B" font-size="10" class="mono">ZERO-GC AUDIO PLL</text>

    <!-- Equalizer Bars -->
    <g transform="translate(22, 68)">
      <rect x="0" y="20" width="16" height="106" rx="5" fill="#1E293B"/>
      <rect x="0" y="34" width="16" height="92" rx="5" fill="#38BDF8" class="eq-bar eq1"/>
      <text x="2" y="144" fill="#64748B" font-size="9" class="mono">BASS</text>

      <rect x="26" y="20" width="16" height="106" rx="5" fill="#1E293B"/>
      <rect x="26" y="48" width="16" height="78" rx="5" fill="#2EE59D" class="eq-bar eq2"/>
      <text x="27" y="144" fill="#64748B" font-size="9" class="mono">LOW</text>

      <rect x="52" y="20" width="16" height="106" rx="5" fill="#1E293B"/>
      <rect x="52" y="26" width="16" height="100" rx="5" fill="#2EE59D" class="eq-bar eq3"/>
      <text x="53" y="144" fill="#64748B" font-size="9" class="mono">MID</text>

      <rect x="78" y="20" width="16" height="106" rx="5" fill="#1E293B"/>
      <rect x="78" y="22" width="16" height="104" rx="5" fill="#2EE59D" class="eq-bar eq4"/>
      <text x="76" y="144" fill="#2EE59D" font-size="9" class="mono">WHIP</text>

      <rect x="104" y="20" width="16" height="106" rx="5" fill="#1E293B"/>
      <rect x="104" y="54" width="16" height="72" rx="5" fill="#38BDF8" class="eq-bar eq5"/>
      <text x="105" y="144" fill="#64748B" font-size="9" class="mono">AIR</text>
    </g>

    <line x1="16" y1="224" x2="150" y2="224" stroke="#1E293B" stroke-width="1"/>
    <text x="16" y="239" fill="#94A3B8" font-size="9.5" class="mono">GPLv3 • ANDROID 7.0+</text>
  </g>
</svg>
