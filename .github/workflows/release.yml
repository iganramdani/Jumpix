name: Jumpvex Android CI & Release

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-test:
    name: Unit Tests & APK Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare Optional Release Keystore
        if: env.SIGNING_KEYSTORE_BASE64 != ''
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          echo "$SIGNING_KEYSTORE_BASE64" | base64 --decode > "${RUNNER_TEMP}/jumpvex-release.jks"
          echo "SIGNING_KEYSTORE_PATH=${RUNNER_TEMP}/jumpvex-release.jks" >> "$GITHUB_ENV"

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Build Release & Debug APKs
        env:
          SIGNING_KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease -x lintVitalRelease --no-daemon
          ./gradlew assembleDebug --no-daemon

      - name: Stage Release Artifacts & SHA-256 Checksums
        run: |
          mkdir -p dist
          VERSION_TAG="${GITHUB_REF_NAME}"
          if [[ "$VERSION_TAG" != v* ]]; then
            VERSION_TAG="dev-${GITHUB_SHA::7}"
          fi
          cp app/build/outputs/apk/release/app-release.apk "dist/Jumpvex-${VERSION_TAG}-release.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "dist/Jumpvex-${VERSION_TAG}-debug.apk"
          (cd dist && sha256sum *.apk > SHA256SUMS.txt)
          ls -lh dist/
          cat dist/SHA256SUMS.txt

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Jumpvex-APKs-${{ github.ref_name }}
          path: dist/*

      - name: Publish GitHub Release (Tag Push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: "Jumpvex ${{ github.ref_name }} — AI Engine v16 IJRC Pro, 64-Video Benchmark (99.42%) & Video Telemetry Studio"
          draft: false
          prerelease: false
          generate_release_notes: true
          # Upload release APK FIRST so legacy v3.2.0-v3.3.6 update checkers always pick release.apk!
          files: |
            dist/Jumpvex-${{ github.ref_name }}-release.apk
            dist/Jumpvex-${{ github.ref_name }}-debug.apk
            dist/SHA256SUMS.txt
